[package]
name = "node-server"
description = "The node service: its routes, its loops and the bmo-node command."
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "bmo-node"
path = "src/main.rs"
test = false

[dependencies]
axum.workspace = true
bmo-node-client = { path = "../client" }
bmo-node-plugin = { path = "../plugin" }
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
hardware = { path = "../hardware" }
node-check = { path = "../node-check" }
policy = { path = "../policy" }
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
store = { path = "../store" }
subtle.workspace = true
sysinfo.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tokio-util.workspace = true
toml.workspace = true
