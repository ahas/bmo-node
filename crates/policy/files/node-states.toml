# What a node's last check came to, and how each reads at a glance: reached, not reached, or not yet asked
# (docs/nodes.md, 「The states」). Each state is named by its code; the web console words it. A
# `personal_tone` is how the state reads on a person's own PC, which is switched off as a matter of course.

[connected]
tone = "good"

[disconnected]
tone = "bad"
personal_tone = "unknown"

[auth]
tone = "bad"

[hostkey]
tone = "bad"

[unreachable]
tone = "bad"
personal_tone = "unknown"

[error]
tone = "bad"

[unknown]
tone = "unknown"
