# How the testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.

testbed = 0
name = "node"

[test]
# The Cargo workspace's crates, the root package's test groups among them; and bun, whose project stands in
# `packages/node-client`, beside its own lockfile.
languages = ["cargo", "bun"]

[tools]
# The hosted tool, checked by the command its tool.toml names (docs/tools.md).
dir = "tools"

[check]
quick = ["layout", "dependencies", "cargo-profile", "shared-versions"]
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui"]

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

[[check.step]]
id = "check"
command = "cargo check --workspace --all-targets"
lane = "wide"

[[check.step]]
id = "clippy"
command = "cargo clippy --workspace --all-targets -- -D warnings"
lane = "wide"

[[check.step]]
id = "fmt"
command = "cargo fmt --all --check"

# The TypeScript client: its types as docs/openapi.json generates them now, and its typecheck.
[[check.step]]
id = "node-client"
command = "bun install --cwd packages/node-client --frozen-lockfile && bun run --cwd packages/node-client check"

[build]
# The service and its command, the node check's own binary, the tunnel door, and the hosted tool's executable.
binaries = ["bmo-node", "node-check", "llm-bridge", "node-exec-tool"]

# The node service's own deploy tree, and the shared data root its configuration and its own folder stand
# under (docs/api.md, 「Configuration」; docs/store.md).
[deploy]
root = "~/.local/share/bmo-node"
link = "deploy"
data_root = "~/.local/share/bmo/data"
env_links = [{ link = "node.toml", target = "env/node.toml" }]
# The service's unit, marked bot, whose health the deployment waits on, and the tunnel door's, marked binary.
units = ["deploy/*.service"]
# Answers 0 once the service the deployed configuration names answers ready (docs/api.md, 「Health」).
health = "~/.local/share/bmo-node/deploy/bin/bmo-node --config ~/.local/share/bmo-node/deploy/node.toml health"

# The hosted tool is placed in its folder's .placed/: the executable the release's bin/ holds, its manifest, the
# schemas and the manual beside it (docs/tools.md).
[[deploy.step]]
id = "place-tools"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/node-exec/.placed
mkdir -p tools/node-exec/.placed
cp bin/node-exec-tool tools/node-exec/tool.toml tools/node-exec/*.json tools/node-exec/manual.md tools/node-exec/.placed/
'''

# The tool is registered with the tool host once the service answers ready, as this service's own, so a supervisor
# reaches it with `bmo use bmo/node_exec`.
[[deploy.step]]
id = "register-tools"
phase = "after-health"
command = '''
set -eu
bmo pocket put tools/node-exec/.placed --placed --service bmo-node --allow room.tools
'''
