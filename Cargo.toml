# The workspace: the crates the node service is built from under `crates/`, and the repository's own package at
# the root, which publishes nothing and holds every test in `tests/`. The version is the repository's one
# version, in semver: the major moves on a change to the boundary API or to a table's contract
# (docs/api.md, 「Versions」).
[workspace]
members = [
  "crates/policy",
  "crates/store",
  "crates/node-check",
  "crates/hardware",
  "crates/llm-bridge",
  "crates/server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = "0.8.4"
clap = { version = "4.5.40", features = ["derive", "env", "string"] }
futures-util = "0.3.34"
http-body-util = "0.1.3"
hyper = { version = "1.6.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.16", features = ["tokio"] }
libc = "0.2.177"
serde_json = "1.0.138"
subtle = "2.6.1"
tempfile = "3.20.0"
tokio = { version = "1.47.0", features = ["macros", "rt", "rt-multi-thread", "net", "time", "signal", "io-util", "process"] }
tokio-tungstenite = "0.29.0"

[package]
name = "node-checks"
description = "The repository's tests: each crate's behaviour and the checks that span the repository."
version.workspace = true
edition.workspace = true
publish = false

[dev-dependencies]
futures-util.workspace = true
hardware = { path = "crates/hardware" }
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
libc.workspace = true
llm-bridge = { path = "crates/llm-bridge" }
node-check = { path = "crates/node-check" }
node-server = { path = "crates/server" }
policy = { path = "crates/policy" }
serde_json.workspace = true
store = { path = "crates/store" }
tempfile.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
