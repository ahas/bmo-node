# The workspace: the crates the node service is built from under `crates/`, and the repository's own package at
# the root, which publishes nothing and holds every test in `tests/`. The version is the repository's one
# version: 0.1.0 with a revision until the first release, each change to the boundary API or to a table's
# contract raising the revision alone (docs/api.md, 「Versions」).
[workspace]
members = [
  "crates/client",
  "crates/plugin",
  "crates/policy",
  "crates/store",
  "crates/node-check",
  "crates/hardware",
  "crates/llm-bridge",
  "crates/server",
]
resolver = "3"

[workspace.package]
version = "0.1.0-rev.2"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = "0.8.4"
base64 = "0.22.1"
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
clap = { version = "4.5.40", features = ["derive", "env", "string"] }
dotenvy = "0.15.7"
flate2 = "1.1.10"
futures = "0.3.34"
futures-util = "0.3.34"
http-body-util = "0.1.3"
hyper = { version = "1.6.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.16", features = ["tokio"] }
jsonschema = { version = "0.58.6", default-features = false }
libc = "0.2.177"
percent-encoding = "2.3.2"
regex = "1.11.1"
roxmltree = "0.21.1"
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
schemars = "1.2.3"
serde ={ version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
sse-stream = "0.2.6"
subtle = "2.6.1"
sysinfo = { version = "0.38.4", default-features = false, features = ["network", "system"] }
tempfile = "3.20.0"
tokio = { version = "1.47.0", features = ["macros", "rt", "rt-multi-thread", "net", "time", "signal", "io-util", "process"] }
tokio-tungstenite = "0.29.0"
tokio-util = { version = "0.7.19", features = ["io"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
url = "2.5.4"

[package]
name = "node-checks"
description = "The repository's tests: each crate's behaviour and the checks that span the repository."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[dev-dependencies]
axum.workspace = true
base64.workspace = true
bmo-node-client = { path = "crates/client" }
bmo-node-plugin = { path = "crates/plugin" }
clap.workspace = true
flate2.workspace = true
futures-util.workspace = true
hardware = { path = "crates/hardware" }
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
jsonschema.workspace = true
libc.workspace = true
llm-bridge = { path = "crates/llm-bridge" }
node-check = { path = "crates/node-check" }
node-server = { path = "crates/server" }
policy = { path = "crates/policy" }
reqwest.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
store = { path = "crates/store" }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.release]
debug = false
strip = "debuginfo"
