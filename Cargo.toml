# The workspace: the crates the node service is built from under `crates/`, and the repository's own package at
# the root, which publishes nothing and holds every test in `tests/`. The version is the repository's one
# version, in semver: the major moves on a change to the boundary API or to a table's contract
# (docs/api.md, 「Versions」).
[workspace]
members = [
  "crates/policy",
  "crates/store",
  "crates/node-check",
  "crates/hardware",
  "crates/llm-bridge",
  "crates/server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
libc = "0.2.177"
serde_json = "1.0.138"

[package]
name = "node-checks"
description = "The repository's tests: each crate's behaviour and the checks that span the repository."
version.workspace = true
edition.workspace = true
publish = false

[dev-dependencies]
hardware = { path = "crates/hardware" }
libc.workspace = true
llm-bridge = { path = "crates/llm-bridge" }
node-check = { path = "crates/node-check" }
node-server = { path = "crates/server" }
policy = { path = "crates/policy" }
serde_json.workspace = true
store = { path = "crates/store" }
